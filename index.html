<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレログ</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0a0a0b;color:#a6a6a8;font-family:system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  a{color:#f5f5f3;font-weight:700;font-size:16px;padding:14px 20px;border:1px solid #2e2e32;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <p id="msg">筋トレログを開いています…</p>
  <a id="go" href="https://claude.ai/artifact/9Fa82DFob1o6kRpcHbRx6X">開かない場合はこちら</a>
</main>
<script>
  // 筋トレアプリ（claude.ai）へ移動するだけの起動ページ
  var APP = 'https://claude.ai/artifact/9Fa82DFob1o6kRpcHbRx6X';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var installed = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches;
  if (installed) {
    setTimeout(function () { location.replace(APP); }, 150);
  } else {
    // ブラウザで開いたとき：インストールできるよう、ここでは移動しない
    document.getElementById('msg').textContent = 'Chromeのメニュー（⋮）から「ホーム画面に追加」→「インストール」を選んでください';
    document.getElementById('go').textContent = '筋トレログを開く';
  }
</script>
</body>
</html>
