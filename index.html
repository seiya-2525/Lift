<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: 1カラムのモバイルアプリ。囲みは最小限、区切りは細線。数値は縦長の Oswald、ラベルは M PLUS 1。
   黒基調・アクセントは自己ベストの金色だけ。角丸は 0（リスト）／6（入力）／8（主ボタン）／14（ボトムシート）。 */
:root{
  --bg:#0a0a0b; --raised:#141416; --well:#1f1f22; --line:#1c1c1f; --line2:#232326; --edge:#2e2e32; --dash:#3a3a3f;
  --ink:#f5f5f3; --ink2:#a6a6a8; --ink3:#7d7d82; --dim:#4a4a4f;
  --gold:#e2bd6b; --rest:#2fd6a3; --danger:#ff7a6e; --onlight:#0a0a0b;
  --sans:'M PLUS 1','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --num:'Oswald','Arial Narrow','Helvetica Neue',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink2);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
#app{max-width:600px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:18px 280px;display:flex;flex-direction:column}
#app.notray{padding-bottom:100px}
.title{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:.01em;text-wrap:balance}
.h2{font-size:22px;font-weight:700;line-height:1.3}
.sub{font-size:13px;color:var(--ink3)}
.lab{font-size:12px;color:var(--ink3)}
.muted{color:var(--ink3)}
.banner{color:var(--gold);font-size:13px;padding:10px 0;border-bottom:1px solid var(--line2);margin-bottom:12px}
.note{font-size:12px;color:var(--ink3);margin-top:8px}
/* buttons: primary / outline / text */
.bp{min-height:52px;border-radius:8px;background:var(--ink);color:var(--onlight);font-size:16px;font-weight:700;letter-spacing:.04em;padding:0 18px}
.bo{min-height:52px;border-radius:8px;border:1px solid var(--edge);color:var(--ink);font-size:14px;padding:0 14px}
.bt{min-height:44px;color:var(--ink2);font-size:14px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--dash)}
.bt.strong{color:var(--ink);font-weight:700;text-decoration:none;font-size:15px}
.bt.danger{color:var(--danger);text-decoration:none}
.icon{width:44px;height:44px;color:var(--ink2);font-size:22px;display:inline-flex;align-items:center;justify-content:center}
.icon:disabled{color:var(--dim)}
input[type=text],input[type=search],input[type=number],input[type=date],select{font-size:16px;background:var(--raised);border:0;border-radius:6px;padding:0 14px;min-height:44px;width:100%;min-width:0}
input::placeholder{color:var(--ink3)}
/* underline tabs */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none;white-space:nowrap;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 0 12px;font-size:17px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tabs button .c{font-family:var(--num);font-weight:500;color:var(--ink3);margin-left:2px}
.tabs button.on .c{color:var(--ink2)}
.tabs.sm button{font-size:15.5px}.gcard .tabs.sm{gap:0;justify-content:space-between}.gcard .tabs.sm button{font-size:13.5px;letter-spacing:-.02em}
.cards{margin-top:22px;touch-action:pan-y}
.cdc{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;min-height:86px;padding:10px 14px 24px;margin-top:-14px;border-radius:16px 16px 0 0;background:var(--raised);border:1px solid var(--edge);border-bottom:0;box-shadow:0 -6px 16px rgba(0,0,0,.55);overflow:hidden}
.cdc:first-child{margin-top:0}
.cdc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--pc)}
.cg{position:absolute;left:0;top:0;height:4px;width:0;background:var(--rest);z-index:1;transition:width .25s linear}
.cdc .nm{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdc .sb{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdc .vr{text-align:right;font-size:11px;color:var(--ink3)}
.cdc .vr b{display:block;font-family:var(--num);font-size:16px;font-weight:600;color:var(--ink)}
.cdc.rest .vv{display:none}
.cdc.add{display:flex;justify-content:center;min-height:60px;padding:10px 14px;border:1px dashed var(--dash);border-radius:16px;background:var(--bg);color:var(--ink2);font-weight:600;box-shadow:none}
.cdc.add::before{display:none}
/* 記録の一覧：カードの長押しで種目を外す。記録のある種目は、カードの位置で確認してから外す */
.cdc[data-cdlp]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cdc.lpon{transform:scale(.985);transition:transform .2s}
.cdx{position:relative;margin-top:-14px;padding:14px 14px 26px;border-radius:16px 16px 0 0;background:var(--raised);border:1px solid var(--danger);border-bottom:0;box-shadow:0 -6px 16px rgba(0,0,0,.55)}.cdx:first-child{margin-top:0}
.cdx p{margin:0 0 12px;font-size:14px;line-height:1.6}.cdx p b{font-weight:700}.cdx .r{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cdx .r button{min-height:44px;border-radius:8px;font-size:14px;font-weight:700}.cdx .r .no{border:1px solid var(--edge)}.cdx .r .yes{background:var(--danger);color:#1a0604}
.tpill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;background:var(--rest);color:#04130d;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap}
.tray .cst{position:absolute;left:0;right:0;top:0;height:4px}
.tray.full{background:var(--bg);border-top:0;box-shadow:none}
.tray.full .in{padding:8px 0 0;gap:0;max-width:600px}
.ocard{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin:0 8px;padding:0 14px;border:1px solid #3a3a40;border-bottom:0;border-radius:18px 18px 0 0;background:var(--raised);overflow:hidden}
.ocard .trayh{flex:none;margin-bottom:-6px}
.ocard .focus .swipe .fg{background:var(--raised)}
.ipanel{flex:none;display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:#26262b;border-top:1px solid #4a4a52;border-radius:14px 14px 0 0;box-shadow:0 -10px 22px rgba(0,0,0,.6);position:relative;z-index:2}
.ipanel .steps{gap:12px}
.tray.full .ipanel .step .row input{font-size:28px;min-height:52px}
.tray.full .ipanel .step .row button{height:52px}
.ipanel .trayx{align-items:center;flex-wrap:nowrap;gap:6px;min-width:0}
.ipanel .trayx .chip{min-height:36px;white-space:nowrap;padding:0 12px;flex:none}
.tray .ipanel .wsw{flex:1 1 auto;min-width:0;min-height:36px;gap:8px;font-size:13.5px;white-space:nowrap}
.tray .ipanel .wsw>span:first-child{overflow:hidden;text-overflow:ellipsis}
.tray .ipanel .wsw .sw{flex:none}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;margin-top:-4px}
.ccl{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.focus .exhead{margin-top:2px;align-items:center}

const PLATES = [[25, '#d6453d', 36], [20, '#3b6fd4', 34], [15, '#e0b72f', 30], [10, '#3da35d', 24], [5, '#e8e8e8', 18], [2.5, '#b0b0b5', 14], [1.25, '#8a8a90', 11]];
function platePlan(target, bar) {
  let side = (target - bar) / 2; const out = [];
  if (!(side > 0)) return { out, rem: 0, side: Math.max(0, side), under: target < bar };
  PLATES.forEach(p => { let c = 0; while (side + 1e-9 >= p[0]) { side -= p[0]; c++; } if (c) out.push([p, c]); });
  return { out, rem: +(side * 2).toFixed(2), side: (target - bar) / 2, under: false };
}

}

async function mergeEx(fromId, toId) {
  const m = exMap(); const from = m[fromId], to = m[toId];
  const dates = Object.keys(S.sessions).filter(d => S.sessions[d].items.some(i => i.ex === fromId));
  dates.forEach(d => {
    const s = S.sessions[d], src = s.items.find(i => i.ex === fromId), dst = s.items.find(i => i.ex === toId);
    if (dst) { dst.sets = dst.sets.concat(src.sets); s.items = s.items.filter(i => i !== src); } else src.ex = toId;
  });
  S.list = S.list.filter(e => e.id !== fromId);
  if (S.sel === fromId) S.sel = toId;
  if (S.gEx === fromId) S.gEx = toId;
  render(); toast('「' + from.name + '」を「' + to.name + '」に統合しています…');
  for (const d of dates) await store.saveSession(d);
  await store.saveList();
  toast(dates.length + '日分の記録を「' + to.name + '」に移しました');
}

function startDb(user) {
  const fs = firebase.firestore(), base = 'users/' + user.uid + '/';
  const clean = o => JSON.parse(JSON.stringify(o));
  db = {
    doc: p => { const r = fs.doc(base + p); return { set: d => r.set(clean(d)), delete: () => r.delete(), get: () => r.get(), onSnapshot: (a, b) => r.onSnapshot(a, b) }; },
    collection: p => { const r = fs.collection(base + p); return { onSnapshot: (a, b) => r.onSnapshot(a, b) }; }
  };
  S.user = { email: user.email || '', name: user.displayName || '' };
  S.dbOk = true; render();
  const fail = () => { S.loaded = { ex: true, s: true, b: true }; render(); toast('記録を読み込めませんでした。開き直してください'); };

    S.list = snap.exists && Array.isArray(snap.data().list) ? JSON.parse(JSON.stringify(snap.data().list)) : [];
    S.loaded.ex = true; if (!busy()) render();
  }, fail);

(function () {
  var HASH = '#app', exiting = false, shown = null;
  function css(el, o) { for (var k in o) el.style[k] = o[k]; return el; }
  function close() { if (shown) { shown.remove(); shown = null; } }
  function ask() {
    if (shown || exiting) return;

    var t = css(document.createElement('div'), { fontWeight: '700', fontSize: '17px', marginBottom: '6px' }); t.textContent = 'アプリを終了しますか？';
    var d = css(document.createElement('div'), { opacity: '.7', fontSize: '13px', marginBottom: '16px' }); d.textContent = '入力中の内容は保存されていないことがあります。';
    var row = css(document.createElement('div'), { display: 'flex', gap: '8px' });
    function btn(label, primary, fn) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      css(b, { flex: '1', minHeight: '46px', borderRadius: '10px', border: primary ? '0' : '1px solid currentColor', cursor: 'pointer', font: 'inherit', fontSize: '15px', fontWeight: '700',
        background: primary ? 'var(--btn, var(--ink, #000))' : 'transparent', color: primary ? 'var(--btnink, var(--onlight, #fff))' : 'inherit' });
      b.addEventListener('click', fn); return b;
    }
    row.appendChild(btn('続ける', true, function () { close(); try { location.hash = HASH; } catch (e) {} }));
    row.appendChild(btn('終了する', false, function () { exiting = true; close(); try { window.close(); } catch (e) {} try { history.back(); } catch (e) {} setTimeout(function () { if (!document.hidden) hint(); }, 700); }));
    box.appendChild(t); box.appendChild(d); box.appendChild(row); wrap.appendChild(box); document.body.appendChild(wrap); shown = wrap;
    var first = row.firstChild; if (first && first.focus) first.focus();
  }
  function onNav() {
    if (exiting || location.hash === HASH) return;
    if (shown) { close(); try { location.hash = HASH; } catch (e) {} return; }
    var c = false; try { c = window.__backClose && window.__backClose(); } catch (e) {}
    if (c) { try { location.hash = HASH; } catch (e) {} return; }
    if (armed()) ask();
  }
  function hint() {
    var h = css(document.createElement('div'), { position: 'fixed', left: '16px', right: '16px', bottom: '90px', zIndex: '2147483001', padding: '14px 16px', borderRadius: '12px', background: 'var(--raised, #222)', color: 'var(--ink, #fff)', font: '14px/1.5 system-ui, sans-serif', boxShadow: '0 6px 24px rgba(0,0,0,.4)', textAlign: 'center' });
    h.textContent = 'このアプリ自身は画面を閉じられません。もう一度「戻る」操作をするか、Claudeの画面を閉じてください。';
    document.body.appendChild(h); setTimeout(function () { h.remove(); }, 6000);
  }
  function armed() { return true; }
  /* 戻る履歴は最初の操作（タップ）の時点で積む。操作なしで積んだ履歴はブラウザに飛ばされるため */
  function arm() {
    ['pointerdown', 'touchstart', 'keydown'].forEach(function (n) { document.removeEventListener(n, arm, true); });
    try { if (location.hash !== HASH) location.hash = HASH; } catch (e) {}
  }
  ['pointerdown', 'touchstart', 'keydown'].forEach(function (n) { document.addEventListener(n, arm, true); });
  window.addEventListener('popstate', onNav);
  window.addEventListener('hashchange', onNav);
})();
</script>
